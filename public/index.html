<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Control</title>
  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.2/jquery.validate.min.css">
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="bg-dark">
  <!-- Page Content-->
  <div class="container p-4 px-lg-5 bg-dark">

    <div class="card-header d-flex flex-row align-items-center justify-content-between w-100 text-white">
      <img src="/assets/apple-touch-icon.png" class="logo">
      <p class="m-0">UGYC - Stage Controller</p>
      <h5 id="timerDisplay">00:00</h5>
    </div>


    <!-- Content Row-->
    <div class="row gx-4 gx-lg-5">
      <div class="col-md-12 mb-5">
        <div class="card h-100 bg-dark">
          <div class="card-body text-white bg-gray mt-3">

            <div class="input-group align-items-center justify-content-center mr-5 mt-3">
              <label class="" for="labelInput">Selected Timer</label>
              <select class="form-control" id="timerDropdown"></select>
              <div class="d-flex">
                <!-- <input type="text" id="timeInput" name="timeInput" class="form-control mr-1" required
                    placeholder="00:00"> -->

              </div>
            </div>

            <div id="buttonContainer" class="d-flex my-5 justify-content-center" style="flex-wrap: wrap;">
              <button onclick="sendButtonMessage('Opening Prayer', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Opening
                Prayer <br /><span class="btn-action-time">05:00</span></button>
              <button onclick="sendButtonMessage('Praise & Worship', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Praise
                & Worship
                <br /><span class="btn-action-time">15:00</span></button>
              <button onclick="sendButtonMessage('Testimony', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Testimony
                <br /><span class="btn-action-time">05:00</span></button>
              <button onclick="sendButtonMessage('Choir Ministration', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Choir
                Ministration
                <br /><span class="btn-action-time">05:00</span></button>
              <button onclick="sendButtonMessage('Hymn', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Hymn
                <br /><span class="btn-action-time">05:00</span>
              </button>
              <button onclick="sendButtonMessage('Word', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Word
                <br /><span class="btn-action-time">40:00</span>
              </button>
              <button onclick="sendButtonMessage('Prayer Rain', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Prayer
                Rain
                <br /><span class="btn-action-time">05:00</span></button>
              <button onclick="sendButtonMessage('Offering', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Offering
                <br /><span class="btn-action-time">05:00</span></button>
              <button onclick="sendButtonMessage('Sunday School Review', this)"
                class="m-1 btn-timer-item btn btn-success d-flex flex-column align-items-center justify-content-between">Sunday
                School Review
                <br /><span class="btn-action-time">05:00</span></button>
            </div>





            <div class="d-flex flex-row input-group align-items-center justify-content-center mt-3 w-100">
              <label for="messageInput" class="mx-3">Other Messages</label>
              <input type="text" id="messageInput" name="messageInput" rows="3" cols="50" class="form-control ml-3"
                placeholder="type message here"></textarea>
              <div class="btn btn-success btn-raised p-1 my-2" id="sendMessage">Send Message</div>
            </div>
          </div>



          <div class="card-footer d-flex flex-column align-items-center justify-content-center">

            <div class="d-flex flex-row input-group align-items-center justify-content-center my-3 w-100 text-white">
              <label for="messageInput" class="mx-3">You've Selected:</label>
              <label id="messageLabel" class="mx-3">-</label>
              <input type="text" id="timeInput" name="timeInput" class="form-control mr-1" placeholder="00:00">
              <button class="btn btn-success btn-raised" id="updateTimer">Update Timer</button>
            </div>

            <div class="d-flex">
              <button class="btn btn-info btn-raised btn-lg m-1" onclick="startExistingTimer()">Start Timer</button>

              <button class="btn btn-danger btn-raised btn-lg m-1" onclick="stopTimer()">Stop Timer</button>
            </div>


          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core theme JS-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
  <script src="js/scripts.js"></script>
  <!-- <script src="src/control.js"></script> -->
</body>

</html>
