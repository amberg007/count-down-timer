<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>Control</title>
  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
</head>

<body class="bg-dark">
  <!-- Page Content-->
  <div class="container p-4 px-lg-5 bg-dark">

    <div class="card-header d-flex flex-row align-items-center justify-content-between w-100 text-white">
      <img src="/assets/apple-touch-icon.png" class="logo">
      <p class="m-0">UGYC - Stage Controller</p>
      <h5 id="timerDisplay">00:00</h5>
    </div>


    <!-- Content Row-->
    <div class="row gx-4 gx-lg-5">
      <div class="col-md-12 mb-5">
        <div class="card h-100 bg-dark">
          <div class="card-body text-white">

            <div class="input-group align-items-center justify-content-center mr-5 mt-3">
              <label class="" for="labelInput">Selected Timer</label>
              <select class="form-control" id="timerDropdown"></select>
              <div class="d-flex">
                <input type="text" id="timeInput" class="form-control mr-1" placeholder="00:00" value="20:40">
                <div class="btn btn-success btn-raised" id="updateTimer">Update Timer</div>
              </div>
            </div>

            <div id="buttonContainer" class="d-flex my-5 justify-content-center" style="flex-wrap: wrap;">
            </div>





            <div class="d-flex flex-row input-group align-items-center justify-content-center mt-3 w-100">
              <label for="messageInput" class="mr-2">Messages</label>
              <div class="d-flex m-2">
                <textarea id="messageInput" name="messageInput" rows="3" cols="50" class="form-control mr-1"
                  placeholder="type message here"></textarea>
                <div class="btn btn-success btn-raised" id="sendMessage">Send Message</div>
              </div>
            </div>


          </div>
          <div class="card-footer d-flex align-items-center justify-content-center">

            <button class="btn btn-warning btn-raised btn-lg m-1" onclick="resetTimer()">Reset Timer</button>

            <button class="btn btn-info btn-raised btn-lg m-1" onclick="startTimer()">Start Timer</button>

            <button class="btn btn-danger btn-raised btn-lg m-1" onclick="stopTimer()">Stop Timer</button>

          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Core theme JS-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.1.2/socket.io.js"></script>
  <script src="js/scripts.js"></script>
  <!-- <script src="src/control.js"></script> -->
</body>

</html>
